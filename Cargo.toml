[package]
name = "gnss-rcv"
version = "0.1.0"
authors = ["Maxime Austruy <austruym@gmail.com>"]
edition = "2021"

[profile.release]
debug = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
structopt = "0.3.26"
env_logger = "0.11.7"
colored = "3.0.0"
rustfft = "6.2.0"
bytesize = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
log = "0.4.27"
ctrlc = "3.4.5"
rayon = "1.10.0"
coredump = "0.1.2"
plotters = "0.3.7"
glob = "0.3.2"
chrono = "0.4.38"
once_cell = "1.21.1"
map_3d = "0.1.5"
egui = "0.31.1"
eframe = "0.31.1"
egui_extras = "0.31.1"

# until hifitime v4.1 & gnss-rtk v0.8
gnss-rs = { git = "https://github.com/rtk-rs/gnss-rs", branch = "main" }
gnss-rtk = { git = "https://github.com/rtk-rs/gnss-rtk", branch = "main", features = ["embed_ephem"] }

[target.'cfg(unix)'.dependencies]
rtlsdr_mt = { git = 'https://github.com/mx4/rtlsdr_mt.rs.git', rev = '8ae8911b06be9680b92ef40367e72134b186aae9' }
